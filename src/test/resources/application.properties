# This file shadows src/main/resources/application.properties on the test
# classpath, so every test gets an in memory database and never needs postgres.
spring.datasource.url=jdbc:h2:mem:game_renting;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.deserialization.fail-on-unknown-properties=true

# ------------------------------------------------------------------
# Pagination
# Repeated from src/main/resources/application.properties on purpose.
# This file shadows the main one wholesale rather than merging, so anything
# left out here silently falls back to a Spring Boot default.
# ------------------------------------------------------------------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# never let a scheduled job fire during a test run
spring.task.scheduling.enabled=false