spring.application.name=starter

# ------------------------------------------------------------------
# Postgres
# These are the defaults for running straight from your IDE.
# docker-compose.yml overrides them with SPRING_DATASOURCE_* so the
# app can reach the db container by hostname instead of localhost.
# ------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/game_renting
spring.datasource.username=keni
spring.datasource.password=keni

# ------------------------------------------------------------------
# JPA / Hibernate
# update creates the tables on first run so you need no migration tool
# yet. Switch to validate + Flyway once you have real data, see README.
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Never keep the persistence context open just to render a response,
# it hides lazy loading bugs until you look for them.
spring.jpa.open-in-view=false

# ------------------------------------------------------------------
# Pagination
# Clients send ?page=&size=&sort=. The cap matters: without it a single
# request for ?size=1000000 pulls the whole table into memory.
# Spring Boot's own default is 2000, which is still far too generous.
# ------------------------------------------------------------------
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# ------------------------------------------------------------------
# Reminders
# ------------------------------------------------------------------
# 07:00 daily. Flip to every second to watch ExpiryReminderJob work.
app.reminders.cron=0 0 7 * * *

# ------------------------------------------------------------------
# JSON
# Jackson 3 ignores unknown properties by default, so a client typo
# like "userNam" is silently accepted and the field is dropped.
# Fail loudly instead.
# ------------------------------------------------------------------
spring.jackson.deserialization.fail-on-unknown-properties=true